[package]
name = "vrct-core"
version = "0.0.0"
description = "VRCT backend core (endpoint router, updater). No Tauri dependency so it can be unit-tested and reused."
edition = "2021"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
semver = "1"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time", "fs", "io-util", "macros", "net"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
futures-util = "0.3"
# Local time for log lines only; `clock` without chrono's default features.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# rustls so Linux builds need no system OpenSSL.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }

# Win32 calls for the clipboard sink (focus a window, copy, Ctrl+V).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect"] }
tokio = { version = "1", features = ["rt", "macros", "time", "test-util"] }
