[package]
name = "vrct-annotator"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Native Gemini annotation jobs and scene-safe YOLO/COCO datasets"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
getrandom = "0.3"
chrono = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
fs2 = "0.4"
tempfile = "3"
clap = { version = "4", features = ["derive"] }
rpassword = "7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
base64 = "0.22"
httpdate = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "net", "io-util"] }
futures-util = "0.3"

[[bin]]
name = "vrct-annotator"
path = "src/bin/annotator.rs"

[[bin]]
name = "vrct-dataset"
path = "src/bin/dataset.rs"
