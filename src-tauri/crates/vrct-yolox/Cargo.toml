[package]
name = "vrct-yolox"
version = "0.0.0"
edition = "2021"
license = "MIT"
description = "Native YOLOX detector training, ONNX export, calibration and evaluation"

[features]
cuda = ["candle-core/cuda"]

[dependencies]
same-file = "1"
candle-core = "=0.11.0"
onnx-protobuf = "=0.2.3"
protobuf = "=3.4.0"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rand = "0.9"
rand_chacha = "0.9"
rand_distr = "0.5"
sha2 = "0.10"
hex = "0.4"
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic"] }
tempfile = "3"

[[bin]]
name = "vrct-yolox"
path = "src/main.rs"
