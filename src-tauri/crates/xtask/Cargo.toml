[package]
name = "xtask"
version = "0.0.0"
edition = "2021"
license = "MIT"
description = "Native VRCT resources, version sync and release packaging"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
sha2 = "0.10"
hex = "0.4"
getrandom = "0.3"
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
