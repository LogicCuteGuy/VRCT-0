[package]
name = "VRCT"
version = "0.0.0"
description = "VRCT-0 by LogicCuteGuy"
authors = ["LogicCuteGuy", "misyaguziya"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace]
members = ["crates/vrct-core", "crates/xtask", "crates/vrct-annotator", "crates/vrct-capture-tools", "crates/vrct-whisper-eval", "crates/vrct-yolox"]

[patch.crates-io]
# Keep WASAPI enumerators in their owning COM apartment (CPAL issue #1302).
cpal = { path = "vendor/cpal" }

# The native core includes inference and shaping libraries. Keep Windows
# development/test builds within ordinary memory limits during LLVM codegen.
[profile.dev.package.vrct-core]
debug = 0
codegen-units = 16

[profile.test.package.vrct-core]
debug = 0
codegen-units = 16

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "vrct_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["ct2"]
# Run local CTranslate2 models in this process (see vrct-core's `ct2` feature).
# Needs cmake; the static MSVC runtime comes from .cargo/config.toml.
ct2 = ["vrct-core/ct2"]

[build-dependencies]
tauri-build = { version = "=2.2.0", features = [] }

[dependencies]
tauri = { version = "=2.5.1", features = ["devtools"] }
tauri-plugin-opener = "=2.2.6"
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
tauri-plugin-fs = "=2.2.1"
tauri-plugin-http = "=2.4.3"
tauri-plugin-shell = "2.2.1"
font-kit = "=0.14.2"
# rustls (not native-tls) so Linux builds need no system OpenSSL; matches vrct-core.
reqwest = { version = "=0.12.15", default-features = false, features = ["rustls-tls"] }
base64 = "=0.22.1"
vrct-core = { path = "crates/vrct-core" }
tokio = { version = "1", features = ["fs", "rt"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "=2.2.0"
