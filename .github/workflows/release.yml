name: Release VRCT

on:
  push:
    tags:
      - 'v*' # タグが 'v' で始まる場合にトリガー (例: v1.0.0)

jobs:
  release:
    name: Build VRCT
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: get_version
        shell: pwsh
        run: |
          $TAG_WITH_V = $env:GITHUB_REF -replace "^refs/tags/", ""
          $VERSION_NUM = $TAG_WITH_V -replace "^v", ""
          echo "VERSION=$VERSION_NUM" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Determine release channel
        id: channel
        shell: pwsh
        run: |
          if ("${{ github.ref_name }}" -match "-(beta|rc)") {
            echo "is_beta=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
            echo "is_beta=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }

      - name: Verify version numbers match the tag
        shell: pwsh
        run: |
          $expected = $env:VERSION
          $failed = $false

          $pkgVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($pkgVersion -ne $expected) {
            Write-Host "::error::package.json version ($pkgVersion) does not match tag version ($expected)"
            $failed = $true
          }

          $tauriVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($tauriVersion -ne $expected) {
            Write-Host "::error::src-tauri/tauri.conf.json version ($tauriVersion) does not match tag version ($expected)"
            $failed = $true
          }

          if ($failed) {
            Write-Host "::error::Version mismatch detected. Bump every version field to $expected before tagging."
            exit 1
          }

      - name: Verify build channel matches the tag
        shell: pwsh
        run: |
          $isBeta = "${{ steps.channel.outputs.is_beta }}" -eq "true"
          $expectedChannel = if ($isBeta) { "beta" } else { "stable" }

          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $actualChannel = if ($version -match "-(beta|rc)") { "beta" } else { "stable" }

          if ($actualChannel -ne $expectedChannel) {
            Write-Host "::error::package.json version implies '$actualChannel' but tag '${{ github.ref_name }}' implies '$expectedChannel'."
            exit 1
          }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.15.0'

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true

      - name: Check the C++ toolchain for CTranslate2
        # The Rust build compiles CTranslate2 (feature `ct2`) with CMake and MSVC.
        run: cmake --version

      - name: Install dependencies
        run: npm ci

      - name: Prepare verified native resources
        run: npm run native:prepare-release

      - name: Test native backend and release tooling
        run: cargo test --manifest-path src-tauri/Cargo.toml -p vrct-core -p xtask --locked -j1 --config 'profile.test.package.vrct-core.debug=0' --config 'profile.test.package.vrct-core.codegen-units=16'

      - name: Build and package
        run: npm run release

      - name: Check the package contains no non-redistributable model
        run: npm run native:verify

      - name: Check the package fits in a GitHub release asset
        shell: pwsh
        run: |
          # GitHub rejects release assets of 2 GiB or more; fail here with a
          # clear message instead of after the whole build.
          $limit = 2GB - 1
          foreach ($file in @("./VRCT.zip", "./src-tauri/target/release/bundle/nsis/VRCT_${{ env.VERSION }}_x64-setup.exe")) {
            $size = (Get-Item $file).Length
            Write-Host "$file = $([math]::Round($size / 1MB)) MB"
            if ($size -ge $limit) {
              Write-Host "::error::$file is $size bytes, over GitHub's 2 GiB release-asset limit"
              exit 1
            }
          }

      - name: Compute SHA-256 checksums
        shell: pwsh
        run: |
          # The installer's own updater and the NSIS bootstrapper both look for
          # "<asset>.sha256" next to each asset and refuse a mismatch.
          $assets = @(
            "./src-tauri/target/release/bundle/nsis/VRCT_${{ env.VERSION }}_x64-setup.exe",
            "./VRCT.zip"
          )
          foreach ($asset in $assets) {
            $hash = (Get-FileHash -Path $asset -Algorithm SHA256).Hash.ToLower()
            Set-Content -Path "$asset.sha256" -Value $hash -NoNewline -Encoding ascii
          }

      - name: Create GitHub Release with assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $dir = "./src-tauri/target/release/bundle/nsis"
          $setup = "$dir/VRCT_${{ env.VERSION }}_x64-setup.exe"
          $args = @(
            "release", "create", "${{ github.ref_name }}",
            "--repo", "${{ github.repository }}",
            "--title", "${{ env.VERSION }}",
            "--verify-tag",
            $setup, "$setup.sha256",
            "./VRCT.zip", "./VRCT.zip.sha256"
          )
          if ("${{ steps.channel.outputs.is_beta }}" -eq "true") { $args += "--prerelease" }
          gh @args
