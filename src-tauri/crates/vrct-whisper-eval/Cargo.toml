[package]
name = "vrct-whisper-eval"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Native reproducible Common Voice preparation and VRCT transcription evaluation"

[[bin]]
name = "vrct-whisper-prepare"
path = "src/bin/prepare.rs"

[[bin]]
name = "vrct-transcription-eval"
path = "src/bin/evaluate.rs"

[dependencies]
vrct-core = { path = "../vrct-core", features = ["ct2"] }
clap = { version = "4", features = ["derive"] }
csv = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
unicode-normalization = "0.1"
rand = "=0.9.2"
rand_chacha = "=0.9.0"
same-file = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "time", "net"] }
