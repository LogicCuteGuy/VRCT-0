[package]
name = "vrct-core"
version = "0.0.0"
description = "VRCT backend core (endpoint router, updater). No Tauri dependency so it can be unit-tested and reused."
edition = "2021"
license = "MIT"

[features]
# Local CTranslate2 translation. Off by default: it compiles CTranslate2 and
# SentencePiece from source (minutes, needs cmake) and, on Windows (MSVC), needs
# the static runtime that src-tauri/.cargo/config.toml sets.
ct2 = ["dep:ct2rs", "dep:sentencepiece", "dep:tokenizers"]

[dependencies]
serde = { version = "1", features = ["derive"] }
# float_roundtrip: parse numbers exactly (the default can be an ulp off), which the settings
# compare and echo back to the UI.
serde_json = { version = "1", features = ["float_roundtrip"] }
base64 = "0.22"
# Random bytes for the WebSocket token.
getrandom = "0.3"
semver = "1"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time", "fs", "io-util", "macros", "net"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
futures-util = "0.3"
# Local time for log lines only; `clock` without chrono's default features.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# rustls so Linux builds need no system OpenSSL.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
# CPU-only CTranslate2 (ruy), SentencePiece for the M2M100 tokenizer, and the
# `tokenizers` library for NLLB's tokenizer.json.
ct2rs = { version = "0.10.1", default-features = false, features = ["ruy"], optional = true }
sentencepiece = { version = "0.13", optional = true }
tokenizers = { version = "0.22", default-features = false, features = ["onig"], optional = true }

# ONNX Runtime for the Silero VAD. `load-dynamic`: the runtime library is found at run time
# (next to the executable or ORT_DYLIB_PATH), so building downloads nothing. api-26 is the
# newest API level the 1.26 runtime on a development machine offers.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "api-26", "load-dynamic"] }

# Win32 calls for the clipboard sink (focus a window, copy, Ctrl+V).
[target.'cfg(windows)'.dependencies]
# WASAPI capture (microphones, and loopback of a playback device for speaker audio).
# Windows only: Linux/macOS keep capturing in the Python backend, and this keeps
# libasound out of their builds.
cpal = "=0.17.1"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect"] }
tokio = { version = "1", features = ["rt", "macros", "time", "test-util"] }
